services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: khmer_micro_store
      POSTGRES_PASSWORD: khmer_micro_store
      POSTGRES_DB: khmer_micro_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khmer_micro_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
